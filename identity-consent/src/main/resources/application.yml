server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: identity-consent
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
