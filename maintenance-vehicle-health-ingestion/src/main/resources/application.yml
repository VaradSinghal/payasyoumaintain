server:
  port: 8083
  servlet:
    context-path: /api/v1

spring:
  application:
    name: maintenance-vehicle-health-ingestion
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

demo:
  seed-on-startup: ${DEMO_SEED_ON_STARTUP:false}

services:
  identity-url: ${IDENTITY_URL:http://localhost:8081/api/v1}

maintenance:
  timezone: ${MAINTENANCE_TIMEZONE:Asia/Kolkata}
  self-record:
    max-km-per-day: ${MAINTENANCE_MAX_KM_PER_DAY:1000}
    max-per-day: ${MAINTENANCE_MAX_PER_DAY:5}

management:
  endpoints:
    web:
      exposure:
        include: health,mappings
  endpoint:
    health:
      show-details: never

