server:
  port: 8083
  servlet:
    context-path: /api/v1

spring:
  application:
    name: maintenance-vehicle-health-ingestion
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

demo:
  seed-on-startup: ${DEMO_SEED_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,mappings
  endpoint:
    health:
      show-details: never
