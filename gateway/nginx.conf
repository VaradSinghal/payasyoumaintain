events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    # Access log format including X-Request-ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id="$request_id"';

    access_log /var/log/nginx/access.log main;

    # Docker internal DNS resolver — dynamically resolves upstream container hostnames
    # so Nginx does not fail to start if an upstream is temporarily unreachable
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        server_name localhost;
        default_type application/json;

        # Standard error pages mapped to JSON error bodies
        # Only intercept 502, 503, 504 (connection failures / down services). Do not intercept 4xx from upstream.
        error_page 502 503 504 =503 @service_unavailable;
        error_page 403 =403 @forbidden;

        location @service_unavailable {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'X-Request-ID' $request_id always;
            return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Upstream service temporarily unavailable","timestamp":"$time_iso8601"}\n';
        }

        location @not_found {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'X-Request-ID' $request_id always;
            return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
        }

        location @forbidden {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'X-Request-ID' $request_id always;
            return 403 '{"error":"FORBIDDEN","message":"Ingestion, seeding and internal endpoints are blocked by gateway","timestamp":"$time_iso8601"}\n';
        }

        # ── Gateway Health Check ─────────────────────────────────────────────
        location = /health {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            return 200 '{"status":"UP","gateway":"paymu-gateway"}\n';
        }

        # ── Microservice Health Checks (Dedicated Routes) ───────────────────
        location = /health/identity {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_identity http://identity-consent:8081;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_identity;
        }

        location = /health/telematics {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_telematics http://telematics-usage-ingestion:8082;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_telematics;
        }

        location = /health/maintenance {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_maintenance http://maintenance-vehicle-health-ingestion:8083;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_maintenance;
        }

        location = /health/pricing {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_pricing http://pricing-policy:8085;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_pricing;
        }

        location = /health/claims {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_claims http://claims-verification:8086;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_claims;
        }

        location = /health/advisory {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_advisory http://notification-advisory:8087;
            rewrite ^ /api/v1/actuator/health break;
            proxy_pass $upstream_advisory;
        }

        location = /health/scoring {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_scoring http://risk-scoring-engine:8084;
            rewrite ^ /health break;
            proxy_pass $upstream_scoring;
        }

        # ── 1. Identity & Consent ───────────────────────────────────────────
        # GET and PUT /identity/api/v1/vehicles/{id}/consent
        location ~ ^/identity/api/v1/vehicles/([a-zA-Z0-9-]+)/consent/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|PUT|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_identity http://identity-consent:8081;
            rewrite ^/identity/(.*)$ /$1 break;
            proxy_pass $upstream_identity;
        }

        # POST /identity/api/v1/vehicles
        location ~ ^/identity/api/v1/vehicles/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(POST|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_identity http://identity-consent:8081;
            rewrite ^/identity/(.*)$ /$1 break;
            proxy_pass $upstream_identity;
        }

        # GET /identity/api/v1/vehicles/{id}
        location ~ ^/identity/api/v1/vehicles/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_identity http://identity-consent:8081;
            rewrite ^/identity/(.*)$ /$1 break;
            proxy_pass $upstream_identity;
        }

        # ── 2. Pricing Policy ───────────────────────────────────────────────
        # POST /pricing/api/v1/quote/{id}
        location ~ ^/pricing/api/v1/quote/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(POST|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_pricing http://pricing-policy:8085;
            rewrite ^/pricing/(.*)$ /$1 break;
            proxy_pass $upstream_pricing;
        }

        # ── 3. Notification Advisory ────────────────────────────────────────
        # GET /advisory/api/v1/advisories/{id}
        location ~ ^/advisory/api/v1/advisories/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_advisory http://notification-advisory:8087;
            rewrite ^/advisory/(.*)$ /$1 break;
            proxy_pass $upstream_advisory;
        }

        # ── 4. Claims Verification ──────────────────────────────────────────
        # POST /claims/api/v1/fnol
        location ~ ^/claims/api/v1/fnol/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(POST|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_claims http://claims-verification:8086;
            rewrite ^/claims/(.*)$ /$1 break;
            proxy_pass $upstream_claims;
        }

        # GET /claims/api/v1/claims/{id}
        location ~ ^/claims/api/v1/claims/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_claims http://claims-verification:8086;
            rewrite ^/claims/(.*)$ /$1 break;
            proxy_pass $upstream_claims;
        }

        # ── 5. Maintenance Vehicle Health Ingestion ─────────────────────────
        # POST /maintenance/api/v1/dtc-readings
        location ~ ^/maintenance/api/v1/dtc-readings/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(POST|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_maintenance http://maintenance-vehicle-health-ingestion:8083;
            rewrite ^/maintenance/(.*)$ /$1 break;
            proxy_pass $upstream_maintenance;
        }

        # GET /maintenance/api/v1/dtc-readings/{id}/latest and /history
        location ~ ^/maintenance/api/v1/dtc-readings/([a-zA-Z0-9-]+)/(latest|history)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_maintenance http://maintenance-vehicle-health-ingestion:8083;
            rewrite ^/maintenance/(.*)$ /$1 break;
            proxy_pass $upstream_maintenance;
        }

        # GET /maintenance/api/v1/timeline/{id}
        location ~ ^/maintenance/api/v1/timeline/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_maintenance http://maintenance-vehicle-health-ingestion:8083;
            rewrite ^/maintenance/(.*)$ /$1 break;
            proxy_pass $upstream_maintenance;
        }

        # ── 6. Telematics Usage Ingestion ───────────────────────────────────
        # GET /telematics/api/v1/aggregates/{id}
        location ~ ^/telematics/api/v1/aggregates/([a-zA-Z0-9-]+)/?$ {
            include /etc/nginx/snippets/cors.conf;
            if ($request_method !~ ^(GET|OPTIONS)$) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'X-Request-ID' $request_id always;
                return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
            }
            include /etc/nginx/snippets/proxy.conf;
            set $upstream_telematics http://telematics-usage-ingestion:8082;
            rewrite ^/telematics/(.*)$ /$1 break;
            proxy_pass $upstream_telematics;
        }

        # ── Catch-all: Everything else returns 404 JSON ──────────────────────
        location / {
            include /etc/nginx/snippets/cors.conf;
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"Resource not found or method not allowed","timestamp":"$time_iso8601"}\n';
        }
    }
}
