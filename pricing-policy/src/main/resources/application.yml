server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pricing-policy
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

# Downstream service URLs — override via environment variables in docker-compose
services:
  identity-url: ${IDENTITY_URL:http://localhost:8081/api/v1}
  telematics-url: ${TELEMATICS_URL:http://localhost:8082/api/v1}
  maintenance-url: ${MAINTENANCE_URL:http://localhost:8083/api/v1}
  scoring-url: ${SCORING_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
